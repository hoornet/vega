name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow builds and tests, it never publishes. Contrast with
# release.yml, which needs contents:write and holds the signing key.
permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Split from the Rust job so a TypeScript error reports in ~1 minute rather
  # than waiting on the WebKitGTK toolchain to install.
  javascript:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags — a tag is mutable. Same
      # rule as release.yml; Dependabot (.github/dependabot.yml) bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # `npm ci --ignore-scripts`, matching release.yml: ci installs the
      # lockfile exactly, and --ignore-scripts blocks postinstall.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit

      # The `*.live.test.ts` files are gated behind env vars that are
      # deliberately not set here (VEGA_BUNKER_URI, VEGA_AUTH_RELAY), so they
      # skip rather than reaching for a bunker or a relay CI cannot provide.
      - name: Unit tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # Same set release.yml installs. Tauri's build script needs the WebKitGTK
      # headers even to compile the test binary.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # tauri-build resolves `frontendDist` (../dist) at compile time, so the
      # frontend has to exist before cargo touches the crate — even for tests.
      - name: Build frontend
        run: npm run build

      # `--locked` is cargo's `npm ci`: it refuses to re-resolve, so a
      # Cargo.toml version bump that never had `cargo check` run against it
      # fails here in seconds instead of silently building a lockfile nobody
      # reviewed. Cargo.lock is a version file — see CLAUDE.md's release steps.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
