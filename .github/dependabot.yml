version: 2

# Vega ships signed binaries built from this repo, so every dependency is part
# of the release's trusted computing base. Alerts alone only cover npm; these
# ecosystems get update PRs too, including the Rust tree and the Actions that
# do the signing.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Nothing gets proposed the day it is published. Dependabot already applies
    # a 3-day default; writing it down makes it visible, and the longer minor
    # and major windows give a release time to be yanked or patched before it
    # reaches a signed build. 2026-10-10: tauri 2.12.3 was 11 minutes old when
    # the Tauri 2.12 PR was being pinned, and three of that week's Tauri plugin
    # releases shipped patches within days. Security updates ignore cooldown
    # entirely, so an advisory fix still arrives immediately.
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      # One PR per ecosystem-week for routine bumps; security updates are
      # always raised separately and immediately, regardless of grouping.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      tauri:
        patterns: ["@tauri-apps/*"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Same windows as npm, for the same reasons.
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]

  # Actions are pinned to commit SHAs in release.yml — this is what keeps them
  # from silently rotting once pinned.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Actions are SHA-pinned and not SemVer-aware for cooldown purposes, so
    # only default-days applies. A week: a re-tagged or compromised action
    # release tends to be caught quickly, and nothing here is urgent.
    cooldown:
      default-days: 7
